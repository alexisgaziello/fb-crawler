name: fb-skydiving-rig-crawler
version: 0.1.0
private: true
packageManager: pnpm@10.30.0
type: module
scripts:
  auth: tsx src/index.ts auth
  build: tsc --noEmit
  check: pnpm run typecheck && pnpm run lint && pnpm run test
  clean:debug: tsx src/clean-debug.ts
  format: biome check --write .
  lint: biome check .
  scrape: tsx src/index.ts scrape
  scrape:daily: tsx src/index.ts scrape --daily
  scrape:debug: tsx src/index.ts scrape --debug
  scrape:debug:steps: tsx src/index.ts scrape --debug --steps
  scrape:headed: tsx src/index.ts scrape --headed
  snapshot:debug: tsx src/index.ts snapshot
  test: vitest run
  typecheck: tsc --noEmit
dependencies:
  dotenv: ^17.4.2
  nodemailer: ^8.0.11
  openai: ^6.42.0
  pino: ^10.3.1
  playwright: ^1.60.0
  zod: ^4.4.3
devDependencies:
  "@biomejs/biome": ^2.5.0
  "@types/node": ^22.10.2
  "@types/nodemailer": ^6.4.17
  tsx: ^4.19.2
  typescript: ^5.7.2
  vitest: ^4.1.8
engines:
  node: ">=22.12.0"
  pnpm: ">=10.0.0"
